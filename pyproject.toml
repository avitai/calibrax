[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling>=1.18"
]

[project]
authors = [
  {email = "mahdi@avitai.bio", name = "Mahdi Shafiei"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "click>=8.0",
  # 0.12.1 is where nnx Variable gained set_value / get_value; 0.12.0 is the only
  # release in the supported range that the jax-ml stack cannot run against.
  "flax>=0.12.1",
  "jax>=0.4.0",
  "jaxlib>=0.4.0",
  "jaxtyping>=0.2.20",
  "numpy>=1.24,<2.5.0",
  "psutil>=5.9.5",
  "typing_extensions>=4.5"
]
description = "Calibrax: Unified benchmarking framework for the JAX scientific ML ecosystem"
dynamic = ["version"]
keywords = [
  "benchmarking",
  "jax",
  "machine-learning",
  "profiling",
  "scientific-computing",
  "statistics"
]
license = {file = "LICENSE"}
name = "calibrax"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
all = [
  "calibrax[changepoint,codecarbon,cuda12,dev,docs,image,mlflow,performance,publication,scientific,stats,test,text,wandb]"
]
all-cpu = [
  "calibrax[changepoint,codecarbon,dev,docs,image,mlflow,performance,publication,scientific,stats,test,text,wandb]"
]
all-macos = [
  "calibrax[changepoint,codecarbon,dev,docs,image,metal,mlflow,performance,publication,scientific,stats,test,text,wandb]"
]
changepoint = [
  "ruptures>=1.1"
]
codecarbon = [
  "codecarbon>=2.0"
]
cuda-dev = [
  "calibrax[cuda12,dev]"
]
cuda12 = [
  # Named for the CUDA major version, as JAX names its own extras (cuda12, cuda12-local,
  # cuda13); JAX publishes no `gpu` extra, and this package also ships `metal`, which is a
  # GPU too. Declaring jax[cuda12] resolves jax-cuda12-plugin[with-cuda], which brings the
  # pjrt package and the CUDA wheels in versions matched to jax, rather than naming the
  # plugin packages here and hoping the two stay in step.
  "jax[cuda12]>=0.4.0",
  # The floors below are stricter than jax-cuda12-plugin[with-cuda] requires: they hold a
  # CUDA 12.6 baseline, and curand and nvtx are not in with-cuda at all.
  "nvidia-cublas-cu12>=12.6",
  "nvidia-cuda-cupti-cu12>=12.6",
  "nvidia-cuda-nvcc-cu12>=12.6",
  "nvidia-cuda-nvrtc-cu12>=12.6",
  "nvidia-cuda-runtime-cu12>=12.6",
  "nvidia-cudnn-cu12>=9.1",
  "nvidia-cufft-cu12>=11.4",
  "nvidia-curand-cu12>=10.3",
  "nvidia-cusolver-cu12>=11.7",
  "nvidia-cusparse-cu12>=12.3",
  "nvidia-nccl-cu12>=2.20",
  "nvidia-nvjitlink-cu12>=12.6",
  "nvidia-nvtx-cu12>=12.6",
  # GPU monitoring
  "pynvml>=11.5.0"
]
dev = [
  "build>=1.0.3",
  "coverage>=7",
  "interrogate>=1.5",
  "ipykernel>=6.29.5",
  "jupytext>=1.16.6",
  "pre-commit>=4.2",
  "pydeps>=1.12.17",
  "pygments>=2.20,<3.0",
  "pyright>=1.1.336",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4",
  "pytest-cov>=6.1.1",
  "pytest-env>=1.0.1",
  "pytest-json-report>=1.5.0",
  "pytest-randomly>=3.15",
  "pytest-timeout>=2.1",
  "pytest-xdist>=3.6",
  "pytest>=9.0.3",
  "radon>=6.0",
  "ruff>=0.1.5",
  "twine>=4.0.2"
]
docs = [
  "griffe>=1.7.3",
  "hippogriffe>=0.2",
  "mkdocs-include-exclude-files>=0.1",
  "mkdocs-ipynb>=0.1",
  "mkdocs-jupyter>=0.24",
  "mkdocs-material>=9.6.7",
  "mkdocs>=1.6.1,<2.0",
  "mkdocstrings-python>=1.1.2",
  "mkdocstrings>=0.28.3",
  "pygments>=2.20,<3.0",
  "pymdown-extensions>=10.16.1"
]
image = [
]
metal = [
  "jax-metal>=0.1.0"
]
mlflow = [
  "mlflow>=2.0"
]
performance = [
  "pytest-codspeed>=4.4.0"
]
publication = [
  "matplotlib>=3.8"
]
scientific = [
]
stats = [
  "scipy>=1.10"
]
test = [
  "beartype>=0.14.1",
  "codecarbon>=2.0",
  "coverage>=7",
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "mlflow>=2.0",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4",
  "pytest-cov>=6.1.1",
  "pytest-env>=1.0.1",
  "pytest-json-report>=1.5.0",
  "pytest-timeout>=2.1",
  "pytest-xdist>=3.6",
  "pytest>=9.0.3",
  "ruptures>=1.1",
  "scikit-learn>=1.4",
  "wandb>=0.18"
]
text = [
]
wandb = [
  "wandb>=0.18"
]

[project.scripts]
calibrax = "calibrax.cli.main:main"

[project.urls]
Documentation = "https://calibrax.readthedocs.io"
Repository = "https://github.com/avitai/calibrax"

[tool.bandit]
exclude_dirs = [
  "benchmarks",
  "examples",
  "scripts",
  "tests"
]
skips = [
  "B101"
]

[tool.coverage.html]
directory = "htmlcov"
skip_covered = false
skip_empty = false

[tool.coverage.report]
exclude_lines = [
  "@(abc\\.)?abstractmethod",
  "class .*\\bProtocol\\):",
  "def __repr__",
  "if 0:",
  "if __name__ == .__main__.:",
  "if self.debug:",
  "if settings.DEBUG",
  "pass",
  "pragma: no cover",
  "raise AssertionError",
  "raise ImportError",
  "raise NotImplementedError"
]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
branch = true
omit = [
  "*/__pycache__/*",
  "*/conftest.py",
  "*/examples/*",
  "*/scripts/*",
  "*/tests/*"
]
parallel = true
source = ["src"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "src/calibrax"
]

[tool.hatch.build.targets.wheel]
packages = ["src/calibrax"]

[tool.hatch.version]
path = "src/calibrax/__init__.py"

[tool.pydocstyle]
add-ignore = [
  "D100",
  "D200",
  "D202",
  "D203",
  "D204",
  "D205",
  "D212",
  "D213",
  "D400",
  "D401",
  "D404",
  "D415"
]
add-select = [
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107"
]
convention = "google"
match = "(?!test_).*\\.py"
match-dir = "(?!tests|scripts|examples).*"

[tool.pylint."messages_control"]
max-args = 10
max-attributes = 12

[tool.pyright]
exclude = [
  "examples",
  "scripts"
]
include = [
  "src",
  "tests"
]
pythonVersion = "3.12"
reportFunctionMemberAccess = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportMissingImports = false
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --verbose --tb=short --color=yes --durations=10 --disable-warnings --cov=calibrax --cov-report=term-missing --cov-report=html --cov-fail-under=80 --timeout=300 --json-report --json-report-file=temp/test-results.json --json-report-indent=2"
cache_dir = ".pytest_cache"
console_output_style = "progress"
filterwarnings = [
  "ignore:.*CUDA-enabled jaxlib.*",
  "ignore:.*cuSPARSE.*",
  "ignore::DeprecationWarning:jax.*",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::UserWarning:jax._src.xla_bridge",
  "ignore:jax.interpreters.xla.pytype_aval_mappings is deprecated:DeprecationWarning"
]
log_cli = true
log_cli_level = "INFO"
markers = [
  "benchmark: marks tests as performance benchmarks (requires pytest-benchmark)",
  "contract: marks tests as contract tests",
  "cpu: marks tests that should run on CPU only",
  "cuda: marks tests that specifically test CUDA functionality",
  "doctest: marks tests as documentation example tests",
  "e2e: marks tests as end-to-end tests",
  "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
  "gpu_required: marks tests as requiring GPU (will fail if GPU unavailable)",
  "integration: marks tests as integration tests",
  "performance: marks tests as performance tests (alias for benchmark)",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "unit: marks tests as unit tests"
]
minversion = "6.0"
python_classes = "Test*"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]

[tool.pytest-env]
"D:JAX_PLATFORMS" = "cpu"
"D:TF_CPP_MIN_LOG_LEVEL" = "1"
"D:WANDB_DIR" = "/tmp/calibrax-test-wandb"
"D:WANDB_MODE" = "offline"
"D:XLA_PYTHON_CLIENT_PREALLOCATE" = "false"

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
fixable = [
  "E",
  "F",
  "F401",
  "F841",
  "I001",
  "W",
  "W291",
  "W292",
  "W293"
]
ignore = [
  # Any is the honest type of a pytree leaf container.
  "ANN401",
  # Google-style docstrings: D203 and D213 conflict with D211 and D212.
  "D203",
  "D213",
  # The formatter owns line length.
  "E501",
  # Optional extras (scipy, wandb, mlflow, pynvml, ...) are imported where they are used so the
  # base install stays light; 193 function-local imports carry that pattern.
  "PLC0415",
  # The __all__ lists are grouped by domain with comments; a sort would destroy the grouping.
  "RUF022",
  # Exception messages are written inline; a message class per raise is noise.
  "TRY003"
]
select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "C90",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TRY",
  "UP",
  "W"
]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["calibrax"]
lines-after-imports = 2
order-by-type = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Examples are narrative walkthroughs: they print, and their main functions are long.
"examples/*" = ["C901", "PLR0915", "T20"]
# Development scripts report on stdout.
"scripts/*" = ["T20"]
# The CLI's output is print by design.
"src/calibrax/cli/main.py" = ["T201"]
# Test factories are keyword-only builders with one parameter per field.
"tests/*" = ["ANN", "D", "PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.uv]
# calibrax does not import optax; flax does. Below 0.2.8 optax calls
# jax.config.update("jax_pmap_shmap_merge"), which jax removed in 0.10, so importing
# flax raises AttributeError and takes out collection for the whole suite. Constrained
# rather than declared, because this is a transitive requirement, not a direct one.
constraint-dependencies = ["optax>=0.2.8"]
python-preference = "only-managed"

[tool.uv.pip]
find-links = [
  "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
]
