name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # macos.yml runs the suite on macOS through this workflow.
  workflow_call:
    inputs:
      os:
        description: The runner the tests run on.
        type: string
        default: ubuntu-latest

concurrency:
  # Called from macos.yml, github.workflow names the caller; the suffix keeps this group apart
  # from the caller's own, which would otherwise cancel the call as a deadlock.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    # The action reads the merged pull request and its checks; a private repository's token
    # reads them only with these, and naming them keeps a public one working if it turns private.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # Only a merge can repeat a pull request. When this step does not run (a pull request, or a
      # call from macos.yml) the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@a61235ad7f851081efca508285b660a9d7f921ea

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # pyright checks the optional integrations too, so it needs their packages (the test extra).
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Lock file is current
        run: uv lock --check

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/ examples/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/ examples/

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/ tests/ examples/

  # The examples, run as substrax's Writing examples guide runs them: on a pull request the ones
  # the change reaches, on any other event every one, so macos.yml's nightly call runs them all.
  examples:
    needs: [already_tested]
    uses: avitai/substrax/.github/workflows/examples.yml@ca731a4d1ac23db5752fea90d629865ce78f71b6
    with:
      already-tested: ${{ needs.already_tested.outputs.skip }}

  # The suite took 6.8-10.3 min per Python in one process, the whole of a pull request's wait, so
  # on ubuntu it runs in four pytest-split shards. Every shard takes the run's id as its
  # pytest-randomly seed: one order, each test in exactly one shard (the shards job checks it).
  # macos.yml's call keeps one job per Python, so the nightly still holds two macOS runners.
  test:
    name: >-
      Test (Python ${{ matrix.python-version }}, ${{ inputs.os || 'ubuntu-latest' }},
      shard ${{ matrix.group }})
    # A push or pull request tests on ubuntu; macos.yml passes macos-15 nightly and before a
    # release.
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        group: ${{ fromJSON((inputs.os || 'ubuntu-latest') == 'ubuntu-latest' && '[1, 2, 3, 4]' || '[1]') }}
    env:
      # The tracked .python-version is every uv command's interpreter request, so the
      # matrix version must reach them all; a venv made with another is replaced by uv sync.
      UV_PYTHON: ${{ matrix.python-version }}
      SHARDS: ${{ (inputs.os || 'ubuntu-latest') == 'ubuntu-latest' && '4' || '1' }}
      GROUP: ${{ matrix.group }}
      SEED: ${{ github.run_id }}
      JAX_PLATFORMS: cpu
      WANDB_DIR: /tmp/calibrax-test-wandb
      WANDB_MODE: offline
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TF_CPP_MIN_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test --extra changepoint --extra mlflow

      - name: Create temp directory
        run: mkdir -p temp

      # A shard measures part of the suite, so it holds no coverage floor: the coverage job holds
      # it over every shard's data. --store-durations records this shard's times for
      # .test_durations, which balances the split.
      - name: Run tests
        env:
          COVERAGE_FILE: ${{ github.workspace }}/covdata/.coverage.tests-${{ matrix.group }}
        run: |
          shard=()
          if [ "$SHARDS" -gt 1 ]; then
            shard=(--splits "$SHARDS" --group "$GROUP" --splitting-algorithm least_duration
                   --store-durations)
          fi
          uv run pytest tests/ "${shard[@]}" \
            --randomly-seed="$SEED" \
            --cov=src/calibrax \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --timeout=300 \
            -v

      # Sybil runs a page's blocks in order, in one process (conftest.py), and pytest-split
      # assigns items one at a time, so the documentation is never split: shard 1 runs all of it.
      - name: Run the documentation examples
        if: matrix.group == 1
        env:
          COVERAGE_FILE: ${{ github.workspace }}/covdata/.coverage.docs
        run: |
          uv run pytest docs/ \
            --randomly-seed="$SEED" \
            --cov=src/calibrax \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --timeout=300 \
            -v

      - name: Hand this shard's coverage to the coverage job
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.os || 'ubuntu-latest' }}-py${{ matrix.python-version }}-${{ matrix.group }}
          path: covdata/
          # upload-artifact skips dot-files unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload this shard's test durations
        if: env.SHARDS != '1'
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-py${{ matrix.python-version }}-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

  # The floor ([tool.coverage.report] fail_under) over the whole suite, for each Python: every
  # shard's data and the documentation run's, combined. On ubuntu for a macOS call too, which
  # relative_files makes possible.
  coverage:
    name: Coverage (Python ${{ matrix.python-version }}, ${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ubuntu-latest
    needs: [test, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install coverage from the lock
        run: uv sync --locked --extra test --no-install-project

      - name: Download this Python's shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-${{ inputs.os || 'ubuntu-latest' }}-py${{ matrix.python-version }}-*
          path: covdata
          merge-multiple: true

      - name: Coverage over every shard
        run: |
          uv run --no-sync coverage combine covdata
          uv run --no-sync coverage report

  # pytest-split gives each test exactly one shard only when every shard collects the same tests
  # in the same order. This checks that the four groups partition tests/ for this run's seed.
  shards:
    name: Test shards partition the suite
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true' && (inputs.os || 'ubuntu-latest') == 'ubuntu-latest'
    env:
      SEED: ${{ github.run_id }}
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test --extra changepoint --extra mlflow

      - name: Compare the four shards with the whole collection
        run: |
          mkdir -p temp
          collect() {
            uv run --no-sync pytest tests/ --collect-only --verbosity=-1 --no-cov \
              --randomly-seed="$SEED" "$@" | grep '::'
          }
          collect > all.txt
          total=$(wc -l < all.txt)
          # tests/ holds about 3,400 tests; far fewer means the id extraction matched nothing.
          [ "$total" -gt 1000 ] || { echo "collected only $total test ids"; exit 1; }
          for group in 1 2 3 4; do
            collect --splits 4 --group "$group" --splitting-algorithm least_duration
          done > shards.txt
          twice=$(sort shards.txt | uniq -d | wc -l)
          missing=$(comm -23 <(sort all.txt) <(sort -u shards.txt) | wc -l)
          extra=$(comm -13 <(sort all.txt) <(sort -u shards.txt) | wc -l)
          echo "$total tests; $(wc -l < shards.txt) across the shards;" \
            "$twice in two shards, $missing in none, $extra not in the collection"
          [ "$twice" -eq 0 ] && [ "$missing" -eq 0 ] && [ "$extra" -eq 0 ]

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, coverage, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv sync --locked --extra dev
          uv run twine check --strict dist/*
