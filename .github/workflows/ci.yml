name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # macos.yml runs the suite on macOS through this workflow.
  workflow_call:
    inputs:
      os:
        description: The runner the tests run on.
        type: string
        default: ubuntu-latest

concurrency:
  # Called from macos.yml, github.workflow names the caller; the suffix keeps this group apart
  # from the caller's own, which would otherwise cancel the call as a deadlock.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    # The action reads the merged pull request and its checks; a private repository's token
    # reads them only with these, and naming them keeps a public one working if it turns private.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # Only a merge can repeat a pull request. When this step does not run (a pull request, or a
      # call from macos.yml) the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@a61235ad7f851081efca508285b660a9d7f921ea

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # pyright checks the optional integrations too, so it needs their packages (the test extra).
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Lock file is current
        run: uv lock --check

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ inputs.os || 'ubuntu-latest' }})
    # A push or pull request tests on ubuntu; macos.yml passes macos-15 nightly and before a
    # release.
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      WANDB_DIR: /tmp/calibrax-test-wandb
      WANDB_MODE: offline
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TF_CPP_MIN_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test --extra changepoint --extra mlflow

      - name: Create temp directory
        run: mkdir -p temp

      - name: Run tests
        run: |
          uv run pytest tests/ \
            --cov=src/calibrax \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --timeout=300 \
            -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv sync --locked --extra dev
          uv run twine check --strict dist/*
