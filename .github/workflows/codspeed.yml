name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Only whether a token exists, never the token itself: the CodSpeed runner reads
      # CODSPEED_TOKEN from the environment, and a set-but-empty value counts as a static
      # token, so it skips OIDC and uploads with an empty key (401 "Missing API key").
      HAS_CODSPEED_TOKEN: ${{ secrets.CODSPEED_TOKEN != '' }}
      CODSPEED_OIDC_ENABLED: ${{ vars.CODSPEED_OIDC_ENABLED }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra test --extra performance

      - name: Run performance smoke tests
        if: env.HAS_CODSPEED_TOKEN != 'true' && env.CODSPEED_OIDC_ENABLED != 'true'
        run: uv run pytest tests/performance/ --no-cov

      - name: Run CodSpeed benchmarks with token
        if: env.HAS_CODSPEED_TOKEN == 'true'
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: uv run pytest tests/performance/ --codspeed --no-cov

      - name: Run CodSpeed benchmarks with OIDC
        if: env.HAS_CODSPEED_TOKEN != 'true' && env.CODSPEED_OIDC_ENABLED == 'true'
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest tests/performance/ --codspeed --no-cov

      - name: Explain skipped CodSpeed upload
        if: env.HAS_CODSPEED_TOKEN != 'true' && env.CODSPEED_OIDC_ENABLED != 'true'
        run: |
          echo "CodSpeed upload skipped because neither CODSPEED_TOKEN nor CODSPEED_OIDC_ENABLED=true is configured."
          echo "Performance smoke tests still ran and remain required."
