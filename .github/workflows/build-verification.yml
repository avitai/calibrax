name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The macOS-14 runners queue for hours and run the same steps; they run on
        # pushes to main only, so a branch or pull request is gated by the ubuntu
        # jobs alone and the merge to main measures both platforms.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Build wheel
        run: uv build

      - name: Check distribution
        run: |
          uv sync --locked --extra dev --extra test
          uv run --no-sync twine check --strict dist/*

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/

      - name: Install in clean venv and verify import
        run: |
          uv venv /tmp/test-env
          # --refresh: a fresh install reads PyPI, not the restored cache. The import reaches
          # the numerical stack: `import calibrax` alone never loads flax.nnx.
          VIRTUAL_ENV=/tmp/test-env uv pip install --refresh dist/*.whl
          /tmp/test-env/bin/python -c "import calibrax, calibrax.core.adapters; print(calibrax.__version__)"
