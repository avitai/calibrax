name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # macos.yml builds on macOS through this workflow.
  workflow_call:
    inputs:
      os:
        description: The runner to build on.
        type: string
        default: ubuntu-latest

concurrency:
  # Called from macos.yml, github.workflow names the caller; the suffix keeps this group apart
  # from the caller's own, which would otherwise cancel the call as a deadlock.
  group: ${{ github.workflow }}-build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ inputs.os || 'ubuntu-latest' }}, Python ${{ matrix.python-version }})
    # A push or pull request builds on ubuntu; macos.yml passes macos-15 nightly and before a
    # release.
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Build wheel
        run: uv build

      - name: Check distribution
        run: |
          uv sync --locked --extra dev --extra test
          uv run --no-sync twine check --strict dist/*

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/ tests/

      - name: Install in clean venv and verify import
        run: |
          uv venv /tmp/test-env
          # --refresh: a fresh install reads PyPI, not the restored cache. The import reaches
          # the numerical stack: `import calibrax` alone never loads flax.nnx.
          VIRTUAL_ENV=/tmp/test-env uv pip install --refresh dist/*.whl
          /tmp/test-env/bin/python -c "import calibrax, calibrax.core.adapters; print(calibrax.__version__)"
