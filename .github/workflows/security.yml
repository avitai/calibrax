name: Security

# ci.yml calls this workflow on every pull request and push, so its result reaches the one
# `required` check the main ruleset names. The weekly run audits against newly published advisories.
on:
  workflow_call:
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  # Called from ci.yml, github.workflow names the caller; the suffix keeps this group apart from
  # the caller's own and from the other calls, which would otherwise cancel each other.
  group: ${{ github.workflow }}-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Every extra the lock resolves, each audited by a pinned pip-audit against both its PyPI
      # and OSV services with a fresh advisory cache. Ignored advisories and their reasons would
      # live in [tool.substrax.audit-lock.ignore] in pyproject.toml; the action also fails on an
      # ignore that no longer matches anything.
      - name: Audit the locked dependencies
        uses: avitai/substrax/.github/actions/audit-lock@e889be4e9fb55fe9c272e219277524630bf9d39e

      # Bandit reports whatever the audit found, so a red job names every scan that failed.
      - name: Bandit
        if: ${{ !cancelled() }}
        run: |
          uv run bandit -r src/calibrax/ examples/ -c pyproject.toml -ll
          uv run bandit -r src/calibrax/ examples/ -c pyproject.toml -f json -o bandit-report.json -q

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
