name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install pip-audit bandit

      - name: Pip audit
        # PYSEC-2026-3552 is a PKCS#7 EnvelopedData Bleichenbacher oracle in
        # pkcs7_decrypt_*. cryptography is transitive here, through mlflow and
        # google-auth, and nothing under src/ imports it or names pkcs7, so the
        # affected API is unreachable. Its fix is cryptography 50.0.0 and mlflow
        # requires cryptography<50, so the resolver cannot take it. Reviewed
        # 2026-08-27; revisit when mlflow relaxes that ceiling.
        run: >-
          uv run pip-audit --ignore-vuln PYSEC-2022-42969
          --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3552

      - name: Bandit
        run: uv run bandit -r src/calibrax/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
