name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Pyright
        run: uv run pyright --warnings src/

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Ruff isort check
        run: uv run ruff check --select I --diff src/ tests/

      - name: Pip audit
        run: |
          uv pip install pip-audit
          # PYSEC-2026-3552 is a PKCS#7 EnvelopedData decryption oracle in
          # pkcs7_decrypt_*. cryptography is transitive here, through mlflow and
          # google-auth, and nothing under src/ imports it or names pkcs7, so the
          # affected API is unreachable. Its fix is cryptography 50.0.0 and mlflow
          # requires cryptography<50, so the resolver cannot take it. Reviewed
          # 2026-08-27; revisit when mlflow relaxes that ceiling.
          uv run pip-audit --ignore-vuln PYSEC-2022-42969 --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3552
