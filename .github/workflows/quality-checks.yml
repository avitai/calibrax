name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # A merge repeats the pull request; a schedule or a manual run re-measures on purpose. When
      # this step does not run the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@ec43d80bbae0040375f746cd1bb07dddb0a0b169

  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      # pyright checks the optional integrations too, so it needs their packages (the test extra).
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Pre-commit
        run: uv run --no-sync pre-commit run --all-files

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/ tests/

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Ruff isort check
        run: uv run --no-sync ruff check --select I --diff src/ tests/

      - name: Pip audit
        run: |
          uv pip install pip-audit
          # PYSEC-2026-3552 is a PKCS#7 EnvelopedData decryption oracle in
          # pkcs7_decrypt_*. cryptography is transitive here, through mlflow and
          # google-auth, and nothing under src/ imports it or names pkcs7, so the
          # affected API is unreachable. Its fix is cryptography 50.0.0 and mlflow
          # requires cryptography<50, so the resolver cannot take it. Reviewed
          # 2026-08-27; revisit when mlflow relaxes that ceiling.
          uv run pip-audit --ignore-vuln PYSEC-2022-42969 --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3552

      - name: Derived status matches the README
        run: uv run python scripts/derive_status.py --check
