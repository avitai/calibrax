name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    # The action reads the merged pull request and its checks; a private repository's token
    # reads them only with these, and naming them keeps a public one working if it turns private.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # A merge repeats the pull request; a schedule or a manual run re-measures on purpose. When
      # this step does not run the output is empty, which every consumer reads as "test it". The
      # compare lives in substrax: skip only when this tree is the pull request's and every check
      # of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@a61235ad7f851081efca508285b660a9d7f921ea

  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      # pyright checks the optional integrations too, so it needs their packages (the test extra).
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Pre-commit
        run: uv run --no-sync pre-commit run --all-files

      - name: Pyright
        run: uv run --no-sync pyright --warnings src/ tests/

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Ruff isort check
        run: uv run --no-sync ruff check --select I --diff src/ tests/

      - name: Derived status matches the README
        run: uv run python scripts/derive_status.py --check
