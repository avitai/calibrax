version: 2
updates:
  # uv, not pip: every CI job installs with `uv sync --locked`, and the pip ecosystem
  # edits pyproject.toml without touching uv.lock, so its pull requests cannot install.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      jax-flax:
        patterns:
          - "jax"
          - "jaxlib"
          - "jax-*"
          - "flax"
      docs-tools:
        patterns:
          - "mkdocs*"
          - "mkdocstrings*"
          - "pymdown-extensions"
          - "pygments"
          - "griffe"
      test-tools:
        patterns:
          - "pytest*"
          - "coverage"
          - "scikit-learn"
          - "scipy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
